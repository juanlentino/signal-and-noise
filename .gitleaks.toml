# Gitleaks configuration — signal-and-noise (theme)
#
# Dev/CI only. This file is never bundled into the WordPress theme artifact.
# It layers a narrow allowlist on top of gitleaks' full upstream ruleset so
# known-safe identifiers, test fixtures, dependencies, and documentation
# placeholders don't produce false positives — while any real secret-shaped
# value in SHIPPED code is still reported.
#
# This repo is intentionally PUBLIC and references real secrets by name (the GHA
# SSH_PRIVATE_KEY in deploy.yml, Cloudflare secrets), so a committed token is a
# genuine risk this scan closes.
#
# Verify locally:  gitleaks detect --source .        # full git history
#                  gitleaks detect --source . --no-git   # working tree

title = "signal-and-noise"

# Inherit gitleaks' complete default ruleset; we only add an allowlist below.
[extend]
useDefault = true

[allowlist]
description = """
Allow known-safe locations and identifiers only. Shipped code (inc/, blocks/,
functions.php, templates, patterns) is fully scanned and trips on any real
secret-shaped value.
"""

# Path allowlist — locations that hold fake secrets / third-party code by design
# and never ship in the theme artifact. All are gitignored (absent from history),
# so this only quiets local `--no-git` scans; CI already never sees them.
paths = [
  # Third-party dependencies — vendored code full of function names that trip
  # generic-api-key (e.g. phpstan.phar → sodium_crypto_*). Never our secrets.
  '''(^|/)vendor/''',
  '''(^|/)node_modules/''',
  # Test fixtures: unit tests assign deliberately-fake tokens to exercise
  # masking/redaction. Mirrors .github/workflows/security-review.yml
  # (exclude-directories: tests).
  '''(^|/)tests/''',
  # Claude Code local state (gitignored): settings.local.json records dev
  # command history that can include curl auth examples. Never committed.
  '''(^|/)\.claude/''',
  # This config's own regex patterns spell out the constant names — don't self-flag.
  '''\.gitleaks\.toml$''',
]

# Value allowlist — matched against the captured SECRET (gitleaks' default
# target), so a real high-entropy value assigned to any of these still trips.
# Patterns tolerate surrounding quotes because some rules (e.g. curl-auth-user)
# capture the quoted argument.
regexes = [
  # 1. wp-config / deploy constant NAMES — public identifiers, never secrets.
  #    (Kept in sync with the plugin repo even where the theme doesn't yet use
  #    them, so shared setup docs never false-positive.)
  '''(?:SN_CLOUDWAYS|CLOUDWAYS|SN_MCP)_[A-Z0-9_]+''',

  # 2. Internal cache / transient / option / hook key names (sn_-prefixed,
  #    lowercase snake_case). A real secret is never a readable identifier.
  '''^['"]?sn_[a-z0-9_]+['"]?$''',

  # 3. curl basic-auth placeholder in REST checklists:
  #    curl -u 'username:app-password' …  (no real secret contains this phrase).
  '''(?i)app-password''',

  # 4. Documentation placeholder values — obvious non-secrets.
  '''(?i)^['"]?(?:…|\.{3}|x{3,}|placeholder|changeme|redacted|dummy|sample|example|your[-_ ]?(?:api[-_ ]?)?(?:key|token|secret|value)?)['"]?$''',
]
