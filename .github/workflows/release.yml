name: Release

# Steps 2 and 3 of a release, on demand: the annotated tag and the draft
# release. Step 1 (the cut PR, squash-merged) stays a human-reviewed PR; see
# docs/VERSIONING.md.
#
# WHY THIS EXISTS. The tag is the shipment: the WordPress self-updater reads
# TAGS (the theme's inc/wp-update-integration.php, via the plugin's tag fetch), so a merged cut that was never tagged
# is code that cannot reach the site (version-tag-parity.yml watches for that
# state daily). Until 2026-09-23 steps 2 and 3 needed a laptop with push access
# and `gh`. A cloud session can dispatch a workflow but cannot push a tag, so
# the release ritual stalled at exactly the step that ships.
#
# WHAT IT REFUSES, before writing anything:
#   - an input that is not X.Y.Z;
#   - main's style.css `Version:` not equal to the input (the cut has not merged),
#     or readme.txt `Stable tag:` disagreeing with it (the two never drift);
#   - a tag that already exists (a re-run never moves a shipped tag);
#   - no commit on main that set the header to this version.
#
# WHAT IT TAGS: the commit on main that set the header to the version, i.e.
# the cut's SQUASH commit, not whatever main's head happens to be when this is
# dispatched. That is the rule in VERSIONING.md ("tag the SQUASH commit"),
# derived here instead of typed.
#
# The release stays a DRAFT, the estate's rule. Drafts are visible only to
# push-access tokens, which is why version-tag-parity.yml does not check them.
#
# Tags pushed with GITHUB_TOKEN trigger no other workflow, and nothing here
# needs one to: deploy.yml is a deliberate, separate dispatch.
#
# Theme port (2026-09-24) of signal-and-noise-tools' release.yml. The only
# differences are where the version lives: style.css `Version:` (no docblock
# star) plus readme.txt `Stable tag:`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag, X.Y.Z (must equal main''s style.css Version: header)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and draft release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Verify, locate the cut, tag, draft
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          die() { echo "::error::$1"; exit 1; }

          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || die "version must be X.Y.Z, got '$VERSION'"
          TAG="v$VERSION"

          # Same regexes as ci.yml's version and Stable-tag checks.
          HEADER="$(grep -m1 -E '^Version:' style.css | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"
          [ "$HEADER" = "$VERSION" ] || die "main's style.css Version: is '$HEADER', not '$VERSION'. Merge the cut PR first."
          STABLE="$(grep -m1 -E '^Stable tag:' readme.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"
          [ "$STABLE" = "$VERSION" ] || die "readme.txt Stable tag: is '$STABLE', not '$VERSION'. The cut stamps both; fix the drift first."

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            die "$TAG already exists. A shipped tag is never moved."
          fi

          # The commit that SET the header. -G matches a diff that adds OR
          # removes the line, so the next bump would match too; keep the newest
          # candidate whose own tree carries the version, i.e. the one that
          # added it.
          PATTERN="^Version: +${VERSION//./\\.}\$"
          SHA=""
          for c in $(git log main --format=%H -G "$PATTERN" -- style.css); do
            if git show "$c:style.css" | grep -qE "$PATTERN"; then SHA="$c"; break; fi
          done
          [ -n "$SHA" ] || die "no commit on main set style.css Version: $VERSION"
          echo "cut commit: $(git log -1 --format='%h %s' "$SHA")"

          # Headline and notes from the CHANGELOG section of this version.
          HEADING="$(grep -m1 -E "^## \[${VERSION//./\\.}\]" CHANGELOG.md || true)"
          [ -n "$HEADING" ] || die "CHANGELOG.md has no ## [$VERSION] heading"
          HEADLINE="$(printf '%s' "$HEADING" | sed -E 's/^## \[[^]]+\] - [0-9-]+ (—|-) //')"
          awk -v h="$HEADING" '$0==h{on=1;next} on&&/^## \[/{exit} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || die "the ## [$VERSION] section is empty"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "$TAG — $HEADLINE"
          git push origin "refs/tags/$TAG"

          gh release create "$TAG" --draft --verify-tag \
            --title "$TAG — $HEADLINE" --notes-file "$RUNNER_TEMP/notes.md"

          {
            echo "### $TAG — $HEADLINE"
            echo "Tagged \`${SHA:0:7}\`; release drafted. Install from wp-admin → Dashboard → Updates (Themes)."
          } >> "$GITHUB_STEP_SUMMARY"
