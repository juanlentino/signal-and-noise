name: Deploy to Cloudways

# v8.5.1+: tag pushes no longer auto-deploy. Theme updates land via the WP admin
# Updates page (inc/wp-update-integration.php registers the theme with WP's
# native update system and renames the unpacked GitHub archive to the correct
# stylesheet slug). workflow_dispatch remains a manual emergency fallback:
#
#   gh workflow run deploy.yml --ref vX.Y.Z
#
# --ref IS MANDATORY AND MUST BE A TAG, and as of v10.44.0 that instruction is
# finally TRUE.
#
# ── v10.44.0: it used to be a lie, and the lie was the bug ──────────────────
#
# This workflow POSTed to Cloudways' /git/pull API with a hardcoded
# `branch_name=main`. It could not deploy a tag. Ever. `--ref` only selected
# which VERSION OF THIS FILE ran — the deploy target was always `main`.
#
# So `--ref v10.42.3` would have displayed "v10.42.3" in the Dashboard's Recent
# deploys row while pulling `main`: a precise, confident, wrong label. On
# 2026-07-16 it shipped `main` and was safe only by luck (main happened to equal
# the tag commit). The honest display — the one that said `main` and looked
# broken — was the only thing telling the truth.
#
# It now builds the payload on the runner with `git archive` (applying
# .gitattributes export-ignore, byte-identical to what WP's native updater
# installs from the tag archive) and rsyncs it over SSH. That makes the tag real:
#   - deploys the EXACT tag dispatched, and ASSERTS the landed style.css Version
#     matches it — a deploy that silently lands the wrong code is worse than one
#     that fails, because it looks successful
#   - no Cloudways API dependency (CLOUDWAYS_* secrets are now unused here)
#   - no server -> GitHub dependency: the 2026-07-16 GitHub REST outage that
#     broke the update checker would not have blocked this
#   - tests/ (79 files, ~591 KB) and docs/ stop being deployed at all
#
# DELIBERATE DIFFERENCE FROM THE PLUGIN'S deploy.yml: it rsyncs with
# --exclude='.git/'. The plugin DELETES .git on purpose (its footprint janitor
# targets it, and a restored .git would just be deleted again). Here, .git may be
# Cloudways' own git integration — the mechanism this replaces. Wiping it would
# burn the old fallback before the new one has ever run against the live server.
# Keep it: harmless if absent, a second fallback if present.
on:
  workflow_dispatch:

# Serialise deploys: if another fires while one is in flight, queue rather than
# cancel — never drop a release.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Archive deploy + cache purge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Guard the ref (must be a tag)
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The plugin's guard rejected a bare `gh workflow run deploy.yml`
          # (which defaults to main) on 2026-07-16. This workflow had no guard,
          # accepted it, and shipped a branch to production. Now it doesn't.
          case "$TAG_REF" in
            v[0-9]*) ;;
            *) echo "::error::invalid tag ref: '$TAG_REF'. Dispatch ON a tag: gh workflow run deploy.yml --ref vX.Y.Z"; exit 1 ;;
          esac
          echo "Deploying tag: $TAG_REF"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build the release payload (identical to the WP updater's)
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix=signal-and-noise/ HEAD -o payload.tar.gz
          echo "Payload: $(du -h payload.tar.gz | cut -f1)"
          # Capture the listing ONCE, then match against the variable.
          #
          # NEVER `tar -tzf … | grep -q …` under `set -o pipefail`: grep -q exits
          # on its first match, tar takes SIGPIPE ("tar: stdout: write error"),
          # and pipefail propagates TAR's failure even though grep SUCCEEDED. It
          # is a race — it depends on whether tar finished writing first — so it
          # passed local verification on a small payload and killed this
          # workflow's FIRST real dispatch (2026-07-16), reporting "payload has
          # no style.css" about a payload that contained style.css. A guard that
          # fires at random is worse than no guard: it reads as "CI being weird".
          PAYLOAD_LIST=$(tar -tzf payload.tar.gz)
          # Fail loudly if export-ignore stops applying: shipping tests/ to a
          # live site is one of the things v10.44.0 exists to stop.
          if grep -qE '^signal-and-noise/(tests|\.github|docs)/' <<<"$PAYLOAD_LIST"; then
            echo "::error::payload contains dev-only paths — .gitattributes export-ignore is not applying"
            exit 1
          fi
          # A theme without style.css is not a theme: WP reads its Version header.
          grep -q '^signal-and-noise/style.css$' <<<"$PAYLOAD_LIST" \
            || { echo "::error::payload has no style.css"; exit 1; }

      - name: Configure SSH for Cloudways
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync the payload into place
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          TAG_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # NO scp, NO remote staging. Two dispatches died proving why:
          #
          #   scp: dest open "~/payload.tar.gz": Permission denied
          #   scp: dest open "/tmp/…-stage.uJf12C/payload.tar.gz": No such file or directory
          #
          # The second is the tell: the ssh session had JUST created that /tmp
          # dir successfully, and scp could not see it. scp runs over the SFTP
          # SUBSYSTEM, which on this host is jailed differently from the
          # interactive SSH shell — so anything scp touches is a different world
          # from anything ssh touches. (The first failure looked like "home is
          # not writable"; that story fit the evidence and was wrong.)
          #
          # rsync -e ssh runs over the SSH SHELL, so it sidesteps the sftp jail
          # entirely AND needs no staging area: extract on the runner, sync
          # straight into the live directory.
          mkdir -p stage
          tar -xzf payload.tar.gz -C stage
          [ -f "stage/signal-and-noise/style.css" ] || { echo "::error::payload did not extract as expected"; exit 1; }

          THEME_DIR=$(ssh "$SSH_USER@$SSH_HOST" 'ls -d /home/master/applications/*/public_html/wp-content/themes/signal-and-noise 2>/dev/null | head -1')
          [ -n "$THEME_DIR" ] || { echo "::error::theme dir not found on the server"; exit 1; }
          echo "Theme dir: $THEME_DIR"
          ssh "$SSH_USER@$SSH_HOST" "command -v rsync >/dev/null 2>&1" \
            || { echo "::error::rsync not on PATH for the remote user"; exit 1; }
          echo "Before: $(ssh "$SSH_USER@$SSH_HOST" "grep -m1 -E '^Version:' '$THEME_DIR/style.css' || echo '(unreadable)'")"

          # -rlptD, NOT -a: `-a` implies -o/-g (owner/group), which only work as
          # root, and this runs as Cloudways' restricted app-scoped SSH user —
          # file ownership is exactly what defeated the footprint janitor.
          rsync -rlptD --delete --exclude='.git/' -e ssh "stage/signal-and-noise/" "$SSH_USER@$SSH_HOST:$THEME_DIR/"

          AFTER=$(ssh "$SSH_USER@$SSH_HOST" "grep -m1 -E '^Version:' '$THEME_DIR/style.css'")
          echo "After:  $AFTER"
          # A deploy that silently lands the wrong code is worse than one that
          # fails: it looks successful. Prove the landed code IS the tag.
          DEPLOYED=$(printf '%s' "$AFTER" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          EXPECTED="${TAG_REF#v}"
          if [ "$DEPLOYED" != "$EXPECTED" ]; then
            echo "::error::deployed $DEPLOYED but expected $EXPECTED from tag $TAG_REF"
            exit 1
          fi
          echo "OK: $THEME_DIR is now $DEPLOYED (tag $TAG_REF)"

      - name: Purge caches via WP-CLI in-process (no App Password required)
        # v9.1.4: the purge work (object cache + Breeze + Varnish + Cloudflare +
        # template overrides) lives in the theme's `sn_purge_all_caches_result`
        # filter at inc/template-maintenance.php, invoked via `wp eval` over the
        # same SSH connection used above.
        #
        # NOTE on the empty array() arg: theme deploys explicitly want
        # template_overrides => true (the default inside sn_purge_all_caches),
        # because theme updates are precisely the case where stale wp_template /
        # wp_template_part DB records mask the updated files. The plugin's deploy
        # passes false — plugin updates don't touch theme files. The 2026-05-07
        # "/notes still showing one card after Update" incident is why.
        #
        # continue-on-error: the rsync above already landed the files; a missed
        # purge is a latency artifact, not a deploy failure.
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          # Let OPcache pick up the new files (validate_timestamps gates this).
          sleep 5
          ssh "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          APP_PUBLIC=$(ls -d /home/master/applications/*/public_html 2>/dev/null | head -1)
          if [ -z "$APP_PUBLIC" ]; then
            echo "::warning::Could not locate app public_html for wp-cli."
            exit 1
          fi
          cd "$APP_PUBLIC"
          if ! command -v wp >/dev/null 2>&1; then
            echo "::warning::wp-cli not found on PATH for SSH_USER. CF edge will revalidate naturally."
            exit 1
          fi
          count=$(wp eval 'echo (int) apply_filters("sn_purge_all_caches_result", 0, array());' 2>&1)
          echo "Purged $count caches via sn_purge_all_caches_result filter (template_overrides=true)."
          REMOTE
