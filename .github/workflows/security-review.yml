name: Security Review
on:
  pull_request:
jobs:
  # Docs-only PRs and release cuts skip the Claude scan, and ONLY the Claude
  # scan. It is ~10 min of wall clock and an API call per push. Markdown under
  # docs/ or at the root gives it nothing to audit, and a cut PR
  # (tools/cut-release.sh) only moves CHANGELOG text and bumps style.css
  # `Version:` and readme.txt `Stable tag:`: the code it ships was scanned on
  # its own PR. The decision is .github/scripts/scan-scope.sh (pinned by
  # tests/ci-scan-scope.php): those two files count only when that line is the
  # ONLY changed line, so a hand edit riding a cut is still scanned. Every
  # other check still runs. Same contract as the plugin repo (#1751).
  #
  # The script is checked out from the BASE commit, never the PR head: a PR
  # that rewrote it to answer "skip" would otherwise waive its own scan.
  #
  # Skipped, not removed: `security` is a REQUIRED check, and a job skipped by
  # its `if` reports as passing, where a workflow that never starts leaves the
  # required check pending forever.
  #
  # Fails toward scanning. Any doubt (API error, empty list, a missing patch,
  # one file or line outside the pattern, no script on the base, this job
  # failing outright) means skip_scan=false and the scan runs.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip_scan: ${{ steps.files.outputs.skip_scan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          verdict=false
          rows=''
          if [ -x .github/scripts/scan-scope.sh ] && rows=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | {filename, patch}'); then
            verdict=$(printf '%s\n' "$rows" | .github/scripts/scan-scope.sh)
          fi
          [ "$verdict" = true ] || verdict=false
          printf '%s\n' "$rows" | jq -r '.filename' 2>/dev/null | sed 's/^/  /'
          echo "skip_scan=$verdict"
          echo "skip_scan=$verdict" >> "$GITHUB_OUTPUT"

  security:
    needs: scope
    # Fork-guard: same-repo PRs only (public-repo fork PRs get no secrets anyway).
    # Dependabot PRs run without access to Actions secrets (ANTHROPIC_API_KEY
    # is empty), so this review can't run there — skip the bot's own PRs.
    # Docs-only PRs and release cuts skip too (see `scope`). !cancelled() keeps
    # this job alive when `scope` itself fails, so a broken classifier scans
    # rather than skips.
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && !(needs.scope.result == 'success' && needs.scope.outputs.skip_scan == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-model: claude-sonnet-5
          comment-pr: 'true'
          run-every-commit: 'false'
          exclude-directories: 'vendor,node_modules,tests'