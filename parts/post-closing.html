<footer class="wp-block-group sn-post-closing">
	<!-- wp:separator {"backgroundColor":"void","className":"is-style-wide sn-post-closing__rule"} -->
	<hr class="wp-block-separator has-text-color has-void-color has-alpha-channel-opacity has-void-background-color has-background is-style-wide sn-post-closing__rule"/>
	<!-- /wp:separator -->

	<!-- v10.14.1: tags removed here — they already render in the top spec-row

	<!-- wp:group {"className":"sn-post-closing__nav","layout":{"type":"flex","flexWrap":"nowrap","justifyContent":"space-between"}} -->

		<!-- wp:group {"className":"sn-post-closing__prev","layout":{"type":"constrained"}} -->

			<!-- wp:paragraph {"className":"sn-post-closing__prev-label"} -->

			<!-- /wp:paragraph -->

			<!-- wp:post-navigation-link {"type":"previous","className":"sn-post-closing__prev-link","showTitle":true,"linkLabel":false} /-->
		</div>
		<!-- /wp:group -->

		<!-- wp:group {"className":"sn-post-closing__next","layout":{"type":"constrained"}} -->
		<div class="wp-block-group sn-post-closing__next">
			<!-- wp:paragraph {"className":"sn-post-closing__next-label"} -->

			<!-- /wp:paragraph -->

			<!-- wp:post-navigation-link {"type":"next","className":"sn-post-closing__next-link","showTitle":true,"linkLabel":false} /-->
		</div>
		<!-- /wp:group -->
	</div>
	<!-- /wp:group -->

	<!-- wp:shortcode -->
	[sn_note_share]
	<!-- /wp:shortcode -->
</footer>
