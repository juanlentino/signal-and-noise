<!doctype html><meta charset="utf-8">
<style>
  /* The theme's own self-hosted DM Mono (assets/fonts/), so a re-render never
     falls through to a substitute monospace. Render headlessly from this file:
     chrome --headless --allow-file-access-from-files --screenshot=og-image.png \
            --window-size=1200,630 --hide-scrollbars file://$PWD/og-image.html */
  @font-face{font-family:'DM Mono';font-weight:400;font-display:block;
             src:url('../fonts/dm-mono-400-latin.woff2') format('woff2')}
  @font-face{font-family:'DM Mono';font-weight:500;font-display:block;
             src:url('../fonts/dm-mono-500-latin.woff2') format('woff2')}
  html,body{margin:0;padding:0}
  body{width:1200px;height:630px;background:#000;color:#fff;
       display:flex;flex-direction:column;justify-content:center;
       padding:0 96px;box-sizing:border-box;
       font-family:'DM Mono','DejaVu Sans Mono',monospace}
  svg{display:block;width:300px;height:263px}
  .bar{width:96px;height:5px;background:#ff4c47;margin:44px 0 26px}
  .url{font-size:22px;font-weight:500;letter-spacing:0.3em}
  .sub{font-size:16px;letter-spacing:0.2em;color:#9a9a9a;margin-top:14px}
</style>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 146 128" fill="none" stroke="#fff" stroke-width="20">
